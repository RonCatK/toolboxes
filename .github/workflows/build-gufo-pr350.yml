# DRAFT, NOT RUN. Intended location: .github/workflows/build-gufo-pr350.yml in a
# fork of github.com/gufo-org/toolboxes (fork must stay public for the 4 vCPU /
# 16 GB hosted runner). No edits to flake.nix or nix/*.nix are needed: the
# upstream stable-release workflow (publish_release.yml) already builds an
# arbitrary Gufo revision with `nix build --override-input gufo-engine ...`.
name: Build Gufo PR350 image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  GUFO_REV: 41c73748d86a588b268a289da712aae215e008c0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record source identity
        run: |
          nix flake prefetch "github:gufo-org/gufo/${GUFO_REV}" --json | tee source-meta.json
      - name: Build image
        run: |
          nix build --print-build-logs \
            --override-input gufo-engine "github:gufo-org/gufo/${GUFO_REV}" \
            .#packages.x86_64-linux.gufo-runtime-image -o result
      - name: Load, verify, push
        run: |
          set -euo pipefail
          # Repo-scoped package name, like upstream's own workflows
          # (ghcr.io/<owner>/<repo>/gufo-runtime): a user-level name not tied to
          # this repo failed with "unknown blob" at the end of the first push.
          target="ghcr.io/${GITHUB_REPOSITORY,,}/gufo-runtime:pr350-${GUFO_REV:0:8}"
          docker load < result
          # nix module hardcodes the upstream name; retag, never push that name
          docker tag ghcr.io/gufo-org/toolboxes/gufo-runtime:edge "$target"
          docker run --rm "$target" gufo --version | tee version.txt
          grep -F "(${GUFO_REV:0:7})" version.txt
          docker inspect --format '{{ index .Config.Labels "org.gufo.engine.revision" }}' "$target" | grep -Fx "$GUFO_REV"
          for attempt in 1 2 3; do
            if docker push "$target"; then break; fi
            [ "$attempt" = 3 ] && exit 1
            echo "push attempt $attempt failed; retrying in 30 s"; sleep 30
          done
